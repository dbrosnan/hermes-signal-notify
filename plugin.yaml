name: signal-notify
version: 1.1.0
description: "Signal texts when a Hermes turn pauses, fails or is interrupted, and when Hermes waits on a question, approval or sudo prompt. Sends through your own signal-cli HTTP daemon."
author: Drew Brosnan
kind: standalone
manifest_version: 2
api_version: 1
requires_hermes: ">=0.21.5"
license: MIT
homepage: https://github.com/dbrosnan/hermes-signal-notify
tags: [notifications, signal, approvals, automation]
requires_env:
  - SIGNAL_HTTP_URL
  - SIGNAL_ACCOUNT
  - SIGNAL_HOME_CHANNEL
config_schema:
  notify_paused: {type: bool, default: true, label: "Turn finished", description: "Text when a turn ends and Hermes is waiting for your next message."}
  notify_failed: {type: bool, default: true, label: "Turn failed", description: "Text when a turn errors out."}
  notify_interrupted: {type: bool, default: true, label: "Turn stopped", description: "Text when a turn is interrupted or stopped."}
  notify_questions: {type: bool, default: true, label: "Questions", description: "Text when Hermes asks you a clarifying question."}
  notify_approvals: {type: bool, default: true, label: "Approvals and sudo", description: "Text when Hermes needs a command approval or a sudo password."}
  include_text: {type: bool, default: true, label: "Include message text", description: "Add a preview of the reply or prompt. Reply text is not secret-redacted; turn this off to send headers only."}
  reply_chars: {type: int, default: 300, label: "Preview length", description: "Characters of reply or prompt text to include when message text is on."}
  recipient: {type: str, default: "", label: "Recipient", description: "Signal number (+15551234567) or UUID to text instead of SIGNAL_HOME_CHANNEL."}
  skip_platforms: {type: list, default: [signal, cron, subagent], label: "Skip platforms", description: "Turns from these platforms never text. signal is skipped because that chat already shows the reply."}
provides_hooks: [post_llm_call, on_session_end, on_human_input_request]
